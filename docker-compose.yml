# Local development orchestration. Not for production as-is.
name: project

x-django: &django
  build: .
  env_file: .env
  depends_on:
    db: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    redis: {condition: service_healthy}
  volumes:
    - .:/app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # 15672 = management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *django
    command: celery -A src.config worker -l info --concurrency 4

  beat:
    <<: *django
    command: celery -A src.config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  flower:
    <<: *django
    command: celery -A src.config flower --port=5555
    ports: ["5555:5555"]

volumes:
  pgdata:
